name: Test Dockerfiles

on:
  pull_request:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Dockerfile changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dockerfile:
              - '**/Dockerfile'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Stable Image
        if: hashFiles('stable/Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: stable/Dockerfile
          push: false
          load: true
          tags: debian-stable-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on Stable Image
        if: hashFiles('stable/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'debian-stable-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Tests on Stable Image
        if: hashFiles('stable/Dockerfile') != ''
        run: |
          docker run --rm -v ${{ github.workspace }}/scripts:/scripts debian-stable-test bash /scripts/run-dummy-tests.sh

      - name: Build Unstable Image
        if: hashFiles('unstable/Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: unstable/Dockerfile
          push: false
          load: true
          tags: debian-unstable-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on Unstable Image
        if: hashFiles('unstable/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'debian-unstable-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Tests on Unstable Image
        if: hashFiles('unstable/Dockerfile') != ''
        run: |
          docker run --rm -v ${{ github.workspace }}/scripts:/scripts debian-unstable-test bash /scripts/run-dummy-tests.sh

  gatekeeper:
    needs: [check-changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate test results
        env:
          CHECK_CHANGES_RESULT: ${{ needs.check-changes.result }}
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$CHECK_CHANGES_RESULT" != "success" ]; then
            echo "check-changes failed with result: $CHECK_CHANGES_RESULT"
            exit 1
          fi
          if [ "$BUILD_AND_TEST_RESULT" = "success" ] || [ "$BUILD_AND_TEST_RESULT" = "skipped" ]; then
            echo "Build and test completed successfully or was skipped."
            exit 0
          else
            echo "Build and test failed with status: $BUILD_AND_TEST_RESULT"
            exit 1
          fi
