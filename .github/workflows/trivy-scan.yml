name: Scheduled Trivy Scan

on:
  schedule:
    # 毎日午前0時に実行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner (All vulnerabilities for SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/debian-stable:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

      - name: Remove SARIF report file
        run: rm -f trivy-results.sarif
        if: always()

      - name: Run Trivy vulnerability scanner (Fail only on fixed vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/debian-stable:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Set up Ruby
        if: failure()
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3.5'

      - name: Run update script
        if: failure()
        run: ruby ./scripts/update-dockerfiles.rb --trivy

      - name: Generate GitHub App Token
        if: failure()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.PR_CREATOR_APP_ID }}
          private-key: ${{ secrets.PR_CREATOR_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Create Pull Request
        if: failure()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "security: trigger rebuild for vulnerability updates"
          branch: trivy-security-update
          delete-branch: true
          title: "security: trigger rebuild due to Trivy vulnerability detection"
          body: |
            Trivy スキャンにより GHCR 上のイメージに修正可能な脆弱性が検出されたため、Docker キャッシュを無効化（`ARG SECURITY_UPDATE_DATE` を更新）してパッケージを最新化する再ビルド用 PR を作成しました。

            PR のテストが通過することを確認の上、マージしてください。
